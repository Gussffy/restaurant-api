services:
  db:
    image: mysql:8.0
    container_name: dev-api-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dev_api
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papp123"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: dev-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: mysql://appuser:app123@db:3306/dev_api
    ports:
      - "3000:3000"

volumes:
  db_data: